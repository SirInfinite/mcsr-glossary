name: Incorrect / outdated term
description: Report a definition, alias, relationship, or detail that needs correction.
title: "[Term correction]: "
body:
  - type: markdown
    attributes:
      value: This issue is public. Explain the correction or source/media update and include supporting evidence when possible. Do not paste private moderation records, personal details or private messages. Publication requires maintainer review.
  - type: input
    id: term
    attributes:
      label: Term
      description: Which published glossary term needs attention?
      placeholder: e.g. Blind
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or outdated?
      description: Quote or summarize the affected text and explain the problem.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: What should the glossary say instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources or evidence
      description: Explain which claim each source supports and its mode/version/era. For media, include the source, creator, useful timestamp and what it demonstrates. State unresolved uncertainty instead of guessing.
      placeholder: Paste links and briefly explain what each supports.
