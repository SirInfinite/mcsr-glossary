name: Suggest a new term
description: Propose missing Minecraft speedrunning terminology for review.
title: "[New term]: "
body:
  - type: markdown
    attributes:
      value: This issue is public. Suggestions are reviewed before publication and are not added automatically; no response time is promised. Include evidence of genuine MCSR usage when possible, but do not paste private messages or personal information. Niche terminology is welcome.
  - type: input
    id: term
    attributes:
      label: Term
      placeholder: e.g. One Cycle
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Proposed definition
      description: Explain the term clearly for someone new to Minecraft speedrunning.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      options:
        - Format
        - Strategy
        - Technique
        - Terminology
        - Tool
        - Unsure
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: Aliases or alternate spellings
      description: Separate multiple aliases with commas.
  - type: textarea
    id: evidence
    attributes:
      label: Sources or evidence
      description: Link genuine community usage and explain the meaning each source supports. Creator clips with timestamps are useful for niche terms; include mode/version when known. Mechanics references alone do not establish slang.
      placeholder: Paste links and briefly explain what each supports.
