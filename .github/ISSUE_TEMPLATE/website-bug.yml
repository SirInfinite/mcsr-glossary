name: Website bug
description: Report a reproducible problem with the glossary website.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Include the full URL, including any query parameters.
      placeholder: https://sirinfinite.github.io/mcsr-glossary/?t=one-cycle
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 143 on Windows 11, or Safari on iPhone
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots or console errors
      description: Add anything else that may help reproduce or diagnose the issue.
