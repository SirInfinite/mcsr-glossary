name: Validate glossary integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned development tools
        run: npm ci
      - name: Content, unit, static and secret checks
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Product, failure, accessibility and viewport checks
        run: npm run test-browser
      - name: Reproduce migrations and enforce database invariants
        env:
          MCSR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test-database
      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-qa
          path: output/structural/final/
          retention-days: 14
