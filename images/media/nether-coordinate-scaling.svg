<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Overworld and Nether coordinate scaling</title>
  <desc id="desc">A diagram showing that one block traveled in the Nether corresponds to eight horizontal blocks in the Overworld.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182235"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="nether" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#471c25"/>
      <stop offset="1" stop-color="#1c1118"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72d982"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="24" fill="#0b0e14"/>
  <rect x="44" y="44" width="1112" height="253" rx="16" fill="url(#sky)" stroke="#52647f" stroke-width="3"/>
  <rect x="44" y="378" width="1112" height="253" rx="16" fill="url(#nether)" stroke="#8b4855" stroke-width="3"/>
  <g font-family="system-ui, sans-serif" fill="#eef4ff">
    <text x="78" y="96" font-size="32" font-weight="700">OVERWORLD</text>
    <text x="78" y="430" font-size="32" font-weight="700">NETHER</text>
    <text x="600" y="346" text-anchor="middle" font-size="25" fill="#b9c3d4">horizontal X/Z coordinates</text>
  </g>
  <g stroke="#72d982" stroke-width="8" fill="none" marker-end="url(#arrow)">
    <path d="M 224 194 H 976"/>
    <path d="M 504 528 H 696"/>
  </g>
  <g fill="#72d982">
    <rect x="193" y="163" width="62" height="62"/>
    <rect x="945" y="163" width="62" height="62"/>
    <rect x="473" y="497" width="62" height="62"/>
    <rect x="665" y="497" width="62" height="62"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <text x="224" y="259" font-size="23" fill="#eef4ff">(800, 800)</text>
    <text x="976" y="259" font-size="23" fill="#eef4ff">(1600, 800)</text>
    <text x="504" y="593" font-size="23" fill="#eef4ff">(100, 100)</text>
    <text x="696" y="593" font-size="23" fill="#eef4ff">(200, 100)</text>
  </g>
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="145" font-size="30" fill="#eef4ff">800 blocks</text>
    <text x="600" y="479" font-size="30" fill="#eef4ff">100 blocks</text>
    <text x="1091" y="334" font-size="26" fill="#72d982">÷ 8 ↓</text>
    <text x="1086" y="364" font-size="26" fill="#72d982">× 8 ↑</text>
  </g>
</svg>
