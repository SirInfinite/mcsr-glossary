<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Nether travel: eight to one horizontal coordinate scale</title>
  <desc id="desc">Traveling from X 100 to 200 in the Nether corresponds to X 800 to 1600 in the Overworld. The scale applies to X and Z, not Y. Each square represents 100 blocks in its dimension.</desc>
  <rect width="800" height="520" fill="#212c30"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f1f1e6">
    <text x="36" y="53" font-size="34" font-weight="700">NETHER TRAVEL</text>
    <text x="36" y="93" font-size="28" fill="#b8c9d0">X and Z scale by 8. Y does not.</text>
    <path d="M36 116H764" stroke="#75898c"/>
    <text x="36" y="163" font-size="30" font-weight="700" fill="#b2dc83">Overworld · 800 blocks</text>
    <g fill="#40573a" stroke="#b2dc83" stroke-width="2">
      <path d="M40 186h76v56H40z M116 186h76v56h-76z M192 186h76v56h-76z M268 186h76v56h-76z M344 186h76v56h-76z M420 186h76v56h-76z M496 186h76v56h-76z M572 186h76v56h-76z"/>
    </g>
    <text x="40" y="282" font-size="28">(800, 800) → (1600, 800)</text>
    <text x="36" y="350" font-size="30" font-weight="700" fill="#f2b093">Nether · 100 blocks</text>
    <rect x="40" y="373" width="76" height="56" fill="#613e35" stroke="#f2b093" stroke-width="2"/>
    <text x="144" y="411" font-size="28">(100, 100) → (200, 100)</text>
    <path d="M36 458H764" stroke="#75898c"/>
    <text x="36" y="496" font-size="28" fill="#b8c9d0">Each square = 100 blocks · coordinates are (X, Z)</text>
  </g>
</svg>
