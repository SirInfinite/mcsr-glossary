<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Two eye bearings estimate a stronghold</title>
  <desc id="desc">Two direction lines extend from separate Eye of Ender throw positions. Their intersection marks an estimated stronghold. This is a conceptual top-down view, not a measured route.</desc>
  <rect width="800" height="520" fill="#212c30"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f1f1e6">
    <text x="36" y="53" font-size="34" font-weight="700">TWO EYE BEARINGS</text>
    <text x="36" y="93" font-size="28" fill="#b8c9d0">Extend the directions until they intersect.</text>
    <path d="M36 116H764 M36 458H764" stroke="#75898c"/>
    <g stroke="#39484d" stroke-width="1">
      <path d="M80 140V436 M160 140V436 M240 140V436 M320 140V436 M400 140V436 M480 140V436 M560 140V436 M640 140V436 M720 140V436 M36 200H764 M36 280H764 M36 360H764"/>
    </g>
    <g stroke="#b2dc83" stroke-width="6" fill="none">
      <path d="M100 390L570 246 M226 178L570 246"/>
    </g>
    <g fill="#b2dc83">
      <circle cx="100" cy="390" r="10"/><circle cx="226" cy="178" r="10"/>
      <path d="M325 310l23 4-16 16z M384 204l20 15-25 7z"/>
    </g>
    <circle cx="570" cy="246" r="17" fill="#efd080"/>
    <circle cx="570" cy="246" r="5" fill="#212c30"/>
    <g font-size="30" font-weight="700">
      <text x="56" y="433">Throw 1</text>
      <text x="148" y="159">Throw 2</text>
      <text x="480" y="316" fill="#efd080">Estimated</text>
      <text x="480" y="352" fill="#efd080">stronghold</text>
    </g>
    <text x="36" y="496" font-size="26" fill="#b8c9d0">Top-down concept · precise angles matter in a run</text>
  </g>
</svg>
